name: Data Science Pipeline CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pipeline-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v3
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Phase 2 pipeline (load -> preprocess -> feature engineering)
        run: python pipeline.py

      - name: Run Phase 3 training pipeline (split -> train -> select best model -> evaluate)
        run: python pipeline_train.py

      - name: Run Phase 3 prediction pipeline (predict -> save to DB)
        run: python pipeline_predict.py

      - name: Upload model + evaluation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-and-eval-artifacts
          path: |
            outputs/models/
            outputs/evaluation_report.json
            outputs/predictions.csv

      - name: Upload updated database
        uses: actions/upload-artifact@v4
        with:
          name: dataset-db
          path: database/dataset.db
